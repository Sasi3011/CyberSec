onsuccess: next_stage
filter: "evt.Parsed.program == 'cybersec-net'"
name: cybersec/net-logs
description: "Parse CyberSec network attack logs"
pattern_syntax:
  SASIKIRAN_ATTACK: 'ATTACK type=%{WORD:attack_type} source=%{IP:source_ip} port=%{NUMBER:target_port}'
nodes:
  - grok:
      name: SASIKIRAN_ATTACK
      apply_on: message
      statics:
        - meta: log_type
          value: cybersec_net_attack
        - meta: attack_type
          expression: evt.Parsed.attack_type
        - meta: source_ip
          expression: evt.Parsed.source_ip
statics:
  - meta: service
    value: cybersec-net
  - meta: source_ip
    expression: evt.Parsed.source_ip
